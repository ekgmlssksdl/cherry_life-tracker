<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" fill="#FFF5F7" rx="40"/>
  <g transform="translate(96, 96)">
    <!-- Cherry 1 -->
    <circle cx="-15" cy="15" r="30" fill="#E63946"/>
    <ellipse cx="-15" cy="15" rx="25" ry="28" fill="#DC2F3F" opacity="0.5"/>
    <circle cx="-20" cy="10" r="8" fill="#FF6B6B" opacity="0.6"/>
    
    <!-- Cherry 2 -->
    <circle cx="15" cy="20" r="28" fill="#E63946"/>
    <ellipse cx="15" cy="20" rx="23" ry="26" fill="#DC2F3F" opacity="0.5"/>
    <circle cx="10" cy="15" r="7" fill="#FF6B6B" opacity="0.6"/>
    
    <!-- Stems -->
    <path d="M -15,-15 Q -20,-40 -10,-55 Q 0,-65 5,-55 Q 10,-45 15,-10" 
          stroke="#2D5016" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Leaf -->
    <ellipse cx="0" cy="-50" rx="12" ry="18" fill="#4CAF50" transform="rotate(20 0 -50)"/>
    <path d="M 0,-60 Q 0,-45 0,-40" stroke="#2D5016" stroke-width="1.5" fill="none"/>
  </g>
</svg>
